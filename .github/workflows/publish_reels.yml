name: AlgoEdge Systems Daily Publisher

on:
  schedule:
    # 09:30 AM PKT is 04:30 AM UTC
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  render-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install opencv-python-headless numpy requests

      - name: Autonomously Render Daily Trading Reel
        run: |
          python render_algo_reel.py

      - name: Publish Reel to Meta (Facebook Page)
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          python publish_to_meta.py
